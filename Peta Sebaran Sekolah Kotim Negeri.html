const map=L.map("map").setView([-2.4,113],9);
const street=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"});

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function popup(s,lat,lng){
 const j=s["Bentuk Pendidikan"]||"";
 return '<div class="popup"><h3>'+esc(s.NAMOBJ)+'</h3><table>'+
 '<tr><td>Status</td><td><b>NEGERI</b></td></tr>'+
 '<tr><td>Jenjang</td><td>'+esc(j)+'</td></tr>'+
 '<tr><td>NPSN</td><td>'+esc(s.NPSN)+'</td></tr>'+
 '<tr><td>Kepala Sekolah</td><td><b>'+esc(s["Nama Kepala Sekolah"]||"-")+'</b></td></tr>'+
 '<tr><td>Alamat</td><td>'+esc(s.Alamat||"-")+'</td></tr>'+
 '<tr><td>Desa</td><td>'+esc(s.Desa||"-")+'</td></tr>'+
 '<tr><td>Kecamatan</td><td>'+esc(s.Kecamatan||"-")+'</td></tr>'+
 '<tr><td>Koordinat</td><td>'+lat.toFixed(6)+', '+lng.toFixed(6)+'</td></tr>'+
 '</table></div>';
}
function populate(){
 const js=[...new Set(schools.map(s=>s["Bentuk Pendidikan"]).filter(Boolean))].sort();
 const ks=[...new Set(schools.map(s=>s.Kecamatan).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"id"));
 jenjang.innerHTML='<option value="">Jenjang: Semua</option>'+js.map(x=>'<option>'+esc(x)+'</option>').join("");
 kecamatan.innerHTML='<option value="">Kecamatan: Semua</option>'+ks.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");
}
function filtered(){
 const q=search.value.toLowerCase().trim(), j=jenjang.value, k=kecamatan.value;
 return schools.filter(s=>{
  const text=[s.NAMOBJ,s.NPSN,s.Desa,s.Kecamatan,s.Alamat,s["Bentuk Pendidikan"],s["Nama Kepala Sekolah"]].join(" ").toLowerCase();
  return (!q||text.includes(q))&&(!j||s["Bentuk Pendidikan"]===j)&&(!k||s.Kecamatan===k);
 });
}
function render(){
 const rows=filtered(); markers.clearLayers(); count.textContent=rows.length;
 const counts={}; rows.forEach(s=>counts[s["Bentuk Pendidikan"]]=(counts[s["Bentuk Pendidikan"]]||0)+1);
 stats.innerHTML=Object.keys(counts).sort().map(j=>'<div class="stat"><b>'+counts[j]+'</b><span>'+esc(j)+'</span></div>').join("")+
 '<div class="stat"><b>'+rows.length+'</b><span>Total Negeri</span></div>';
 list.innerHTML=""; let mapped=0;
 rows.forEach(s=>{
  const lat=parseFloat(s.Lintang),lng=parseFloat(s.Bujur),j=s["Bentuk Pendidikan"]||"",color=colors[j]||"#64748b";
  if(Number.isFinite(lat)&&Number.isFinite(lng)&&!(lat===0&&lng===0)){
   mapped++;
   const marker=L.circleMarker([lat,lng],{radius:7,fillColor:color,color:"#fff",weight:1.5,fillOpacity:.9});
   marker.bindPopup(popup(s,lat,lng)); marker.addTo(markers);
   const d=document.createElement("div"); d.className="school";
   d.innerHTML='<b>'+esc(s.NAMOBJ)+'</b><small>NPSN: '+esc(s.NPSN)+'</small><small>'+esc(s.Desa)+' • '+esc(s.Kecamatan)+'</small><span class="badge">'+esc(j)+' • NEGERI</span>';
   d.onclick=()=>{map.setView([lat,lng],15);marker.openPopup();};
   list.appendChild(d);
  } else {
   const d=document.createElement("div"); d.className="school";
   d.innerHTML='<b>'+esc(s.NAMOBJ)+'</b><small>NPSN: '+esc(s.NPSN)+'</small><small>'+esc(s.Kecamatan)+'</small><span class="badge">'+esc(j)+' • NEGERI</span>';
   d.title="Belum memiliki koordinat valid"; list.appendChild(d);
  }
 });
 if(!list.children.length)list.innerHTML='<div class="empty">Tidak ada sekolah yang sesuai.</div>';

}
function resetAll(){search.value="";jenjang.value="";kecamatan.value="";render();map.setView([-2.4,113],9);}
search.addEventListener("input",render); jenjang.addEventListener("change",render); kecamatan.addEventListener("change",render); reset.addEventListener("click",resetAll);
